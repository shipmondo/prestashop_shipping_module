---
name: Test and lint code
on:
  push:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ['20']
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      # We do not actually care about the package version since we do not rely on any of them during production.
      - name: Update lockfile
        run: composer update
      - name: Install PHP dependencies
        run: composer install
      - name: Check PHP for lint errors
        run: ./vendor/bin/php-cs-fixer check
      - name: Run unit tests
        run: ./vendor/bin/phpunit
  php72-compatibility:
    # PrestaShop 8 supports PHP 7.2, but the dev tooling needs PHP 8.1+, so only lint the files we ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          tools: none
      - name: Lint shipped PHP files on PHP 7.2
        run: |
          php -v
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(git ls-files -z '*.php' ':!:tests/**')
          exit $status
